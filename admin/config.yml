backend:
  name: git-gateway
  branch: main # Mude para 'master' se a sua branch principal for master

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "conteudo"
    label: "Conteúdo do Site"
    files:
      - file: "index.html"
        label: "Página Principal"
        name: "home"
        fields:
          - { label: "Título Principal", name: "hero_title", widget: "string" }
          - { label: "Subtítulo / Descrição", name: "hero_subtitle", widget: "text" }
          - { label: "Telefone de Contato", name: "phone", widget: "string" }
          - { label: "Link do WhatsApp", name: "whatsapp_link", widget: "string" }

